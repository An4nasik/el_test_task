x-common-build: &common-build
  context: ..
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_consultant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: *common-build
    env_file: ../.env
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "8000:8000"

  worker:
    build: *common-build
    env_file: ../.env
    command: ["uvicorn", "src.worker.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      - api
      - rabbitmq

  bot:
    build: *common-build
    env_file: ../.env
    command: ["python", "-m", "src.bot.main"]
    depends_on:
      - api

volumes:
  pgdata:
